<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28785b"><title>냉장고 구조대</title>
<style>
:root{--green:#28785b;--pale:#eaf5ef;--ink:#20312a;--muted:#66756d;--line:#dce6df;--red:#b93838;--amber:#9a6200}*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:16px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e2a72d;outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:20px 16px 48px}.hero{background:var(--green);color:white;border-radius:18px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:clamp(25px,5vw,34px)}.hero p{margin:0;opacity:.94}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat,.panel,.item{background:white;border:1px solid var(--line);border-radius:14px}.stat{padding:14px;text-align:center}.stat strong{display:block;font-size:26px}.stat span{font-size:13px;color:var(--muted)}.panel{padding:18px;margin:14px 0}.panel h2{font-size:19px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700;font-size:14px}.field input,.field select,.tools input,.tools select{width:100%;min-width:0;border:1px solid #bacbc0;border-radius:9px;padding:11px;background:white;color:var(--ink)}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--green);color:white}.secondary{background:var(--pale);color:var(--green)}.quiet{background:#eef1ef;color:#34433b}.danger{background:#fff0ef;color:var(--red)}.tools{display:grid;grid-template-columns:1fr 180px 160px;gap:10px;margin-bottom:12px}.list{display:grid;gap:10px}.item{padding:15px;display:grid;grid-template-columns:1fr auto;gap:10px}.item h3{margin:0 0 7px;font-size:18px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:14px;line-height:1.7}.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800;margin:0 5px 5px 0;background:#edf1ee;color:#45554b}.pill.soon{background:#fff1d7;color:#825300}.pill.expired{background:#ffe8e6;color:#a12c2c}.pill.good{background:#e4f4e9;color:#236747}.itemactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.itemactions button{padding:8px 10px;font-size:13px}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.notice{font-size:13px;color:var(--muted);line-height:1.6;margin-top:12px}.hidden{display:none!important}.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}@media(max-width:620px){.wrap{padding:12px 10px 32px}.hero{padding:20px 17px}.stats{gap:7px}.stat{padding:11px 4px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.item{grid-template-columns:1fr}.itemactions{justify-content:flex-start}.panel{padding:14px}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><h1>🥬 냉장고 구조대</h1><p>우리 가족이 보관한 식품을 한눈에 보고, 먼저 먹어야 할 것부터 챙겨요.</p></header>
<section class="stats" aria-label="보관 현황"><div class="stat"><strong id="total">0</strong><span>보관 중 품목</span></div><div class="stat"><strong id="soonCount">0</strong><span>7일 이내 임박</span></div><div class="stat"><strong id="expiredCount">0</strong><span>기한 지남</span></div></section>
<section class="panel" id="formPanel"><h2 id="formTitle">➕ 식품 등록</h2><form id="foodForm"><input id="editId" type="hidden"><div class="formgrid">
<div class="field"><label for="name">품목 이름 *</label><input id="name" maxlength="80" required placeholder="예: 우유, 두부, 사과"></div>
<div class="field"><label for="expiry">유통기한 / 소비기한 *</label><input id="expiry" type="date" required></div>
<div class="field"><label for="qty">수량 *</label><input id="qty" type="number" min="1" max="9999" step="1" required value="1"></div>
<div class="field"><label for="unit">단위</label><select id="unit"><option>개</option><option>팩</option><option>봉</option><option>병</option><option>통</option><option>g</option><option>kg</option><option>ml</option><option>L</option><option>묶음</option><option>기타</option></select></div>
<div class="field"><label for="owner">등록한 가족</label><input id="owner" maxlength="30" placeholder="예: 엄마, 민수 (선택)"></div>
<div class="field"><label for="place">보관 장소</label><select id="place"><option>냉장실</option><option>냉동실</option><option>실온 / 팬트리</option></select></div>
<div class="field wide"><label for="memo">메모 (선택)</label><input id="memo" maxlength="160" placeholder="예: 개봉함, 요리 재료로 사용 예정"></div>
</div><div class="actions"><button class="primary" type="submit" id="saveBtn">식품 등록하기</button><button class="quiet hidden" type="button" id="cancelEdit">수정 취소</button></div><p class="notice">※ 입력한 정보는 현재 사용 중인 브라우저에 저장됩니다. 가족의 다른 휴대전화·컴퓨터와 자동으로 공유되지는 않습니다.</p></form></section>
<section class="panel"><h2>📋 우리 집 보관 목록</h2><div class="tools"><input id="search" type="search" aria-label="품목 검색" placeholder="품목 또는 메모 검색"><select id="filter" aria-label="목록 필터"><option value="all">전체 보기</option><option value="soon">7일 이내 임박</option><option value="expired">기한 지남</option><option value="good">아직 여유 있음</option></select><select id="placeFilter" aria-label="보관 장소 필터"><option value="all">모든 장소</option><option>냉장실</option><option>냉동실</option><option>실온 / 팬트리</option></select></div><div id="foodList" class="list" aria-live="polite"></div><p class="notice">기한은 오늘을 기준으로 계산합니다. 기한이 지난 식품은 상태와 보관법을 확인하고, 날짜만으로 먹어도 된다고 판단하지 마세요.</p></section>
<div class="actions"><button class="quiet" id="exportBtn" type="button">백업 파일 내려받기</button><button class="quiet" id="importBtn" type="button">백업 파일 불러오기</button><input class="hidden" id="importFile" type="file" accept=".json,application/json"></div>
<p class="footer">냉장고 구조대 · 가볍게 실행하는 가족용 식품 관리 앱</p>
</main>
<script>
(function(){
const $=id=>document.getElementById(id), KEY='fridge-rescue-v1';
let foods=[];
try{foods=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(foods))foods=[]}catch(e){foods=[]}
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysLeft=date=>{const d=new Date(date+'T00:00:00');return Math.round((d-today())/86400000)};
const status=f=>{const n=daysLeft(f.expiry);return n<0?'expired':n<=7?'soon':'good'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(foods))}catch(e){alert('저장 공간이 부족해 저장하지 못했습니다. 백업 파일을 내려받아 주세요.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 $('total').textContent=foods.length;$('soonCount').textContent=foods.filter(f=>status(f)==='soon').length;$('expiredCount').textContent=foods.filter(f=>status(f)==='expired').length;
 const q=$('search').value.trim().toLowerCase(),filter=$('filter').value,place=$('placeFilter').value;
 const rows=foods.filter(f=>(!q||(f.name+' '+f.memo+' '+f.owner).toLowerCase().includes(q))&&(filter==='all'||status(f)===filter)&&(place==='all'||f.place===place)).sort((a,b)=>a.expiry.localeCompare(b.expiry)||a.name.localeCompare(b.name,'ko'));
 if(!rows.length){$('foodList').innerHTML='<div class="empty">'+(foods.length?'조건에 맞는 품목이 없습니다. 검색이나 필터를 바꿔 보세요.':'아직 등록한 식품이 없습니다.<br>위에서 첫 식품을 등록해 보세요.')+'</div>';return}
 $('foodList').innerHTML=rows.map(f=>{const n=daysLeft(f.expiry),s=status(f),label=n<0?'기한 '+Math.abs(n)+'일 지남':n===0?'오늘까지':n===1?'내일까지':'D-'+n,cls=s==='expired'?'expired':s==='soon'?'soon':'good';return '<article class="item"><div><h3>'+esc(f.name)+' <span class="pill '+cls+'">'+label+'</span></h3><div class="meta">수량: <b>'+esc(f.qty)+' '+esc(f.unit)+'</b> · 기한: '+esc(f.expiry)+'<br>장소: '+esc(f.place)+' · 등록자: '+esc(f.owner||'미입력')+(f.memo?'<br>메모: '+esc(f.memo):'')+'</div></div><div class="itemactions"><button class="secondary" data-act="use" data-id="'+f.id+'">1개 사용</button><button class="secondary" data-act="edit" data-id="'+f.id+'">수정</button><button class="quiet" data-act="done" data-id="'+f.id+'">소진 완료</button><button class="danger" data-act="delete" data-id="'+f.id+'">삭제</button></div></article>'}).join('');
}
function resetForm(){ $('foodForm').reset();$('editId').value='';$('qty').value='1';$('formTitle').textContent='➕ 식품 등록';$('saveBtn').textContent='식품 등록하기';$('cancelEdit').classList.add('hidden')}
$('foodForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value;const item={id:id||((Date.now().toString(36))+Math.random().toString(36).slice(2,7)),name:$('name').value.trim(),expiry:$('expiry').value,qty:Number($('qty').value),unit:$('unit').value,owner:$('owner').value.trim(),place:$('place').value,memo:$('memo').value.trim()};if(!item.name||!item.expiry||!Number.isInteger(item.qty)||item.qty<1){alert('품목, 기한, 1개 이상의 수량을 확인해 주세요.');return}if(id){foods=foods.map(f=>f.id===id?item:f)}else foods.push(item);save();resetForm();render()});
$('cancelEdit').addEventListener('click',resetForm);
$('foodList').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const f=foods.find(x=>x.id===b.dataset.id);if(!f)return;switch(b.dataset.act){case'use':if(f.qty>1)f.qty--;else{if(!confirm(f.name+' 수량이 1개입니다. 사용 완료 처리할까요?'))return;foods=foods.filter(x=>x.id!==f.id)}break;case'done':if(!confirm(f.name+'을(를) 보관 목록에서 소진 완료 처리할까요?'))return;foods=foods.filter(x=>x.id!==f.id);break;case'delete':if(!confirm(f.name+' 항목을 삭제할까요?'))return;foods=foods.filter(x=>x.id!==f.id);break;case'edit':$('editId').value=f.id;$('name').value=f.name;$('expiry').value=f.expiry;$('qty').value=f.qty;$('unit').value=f.unit;$('owner').value=f.owner||'';$('place').value=f.place;$('memo').value=f.memo||'';$('formTitle').textContent='✏️ 식품 정보 수정';$('saveBtn').textContent='수정 내용 저장';$('cancelEdit').classList.remove('hidden');$('formPanel').scrollIntoView({behavior:'smooth',block:'start'});return}save();render()});
['search','filter','placeFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(foods,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='냉장고구조대-백업-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(f=>f&&typeof f.name==='string'&&typeof f.expiry==='string'&&Number.isFinite(Number(f.qty))))throw new Error('형식');if(!confirm('현재 목록을 백업 파일의 '+data.length+'개 품목으로 교체할까요?'))return;foods=data.map(f=>({...f,id:String(f.id||Date.now()+Math.random())}));save();render();alert('백업을 불러왔습니다.')}catch(err){alert('올바른 냉장고 구조대 JSON 백업 파일이 아닙니다.')}finally{e.target.value=''}});
render();
})();
</script></body></html>
